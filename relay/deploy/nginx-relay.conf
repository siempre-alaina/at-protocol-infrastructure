# AT Protocol Relay - nginx configuration
# Domain: relay.service.dashofextra.com

upstream relay_backend {
    server 127.0.0.1:2470;
    keepalive 32;
}

server {
    listen 80;
    server_name relay.service.dashofextra.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;  # No http2 - required for WebSocket support on nginx < 1.25.1
    server_name relay.service.dashofextra.com;

    # TLS Configuration (uses wildcard cert)
    ssl_certificate /etc/letsencrypt/live/service.dashofextra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.dashofextra.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RelaySSL:10m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # WebSocket support for firehose
    location /xrpc/com.atproto.sync.subscribeRepos {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Disable buffering for real-time events
        proxy_buffering off;
    }

    # Regular XRPC endpoints
    location /xrpc/ {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Client body size for potential POST data
        client_max_body_size 10m;
    }

    # Health endpoints
    location ~ ^/(health|ready|live)$ {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }

    # Feed viewer web page
    location = /feed {
        alias /var/www/html/relay-feed.html;
        default_type text/html;
    }

    # Default location
    location / {
        return 404;
    }

    # Logging
    access_log /var/log/nginx/relay.access.log;
    error_log /var/log/nginx/relay.error.log;
}
